function bindForm(){
  const set = (sel,v)=>{ const e=$(sel); if(e) e.value = v||''; };
  set('#fName',form.name); set('#fAddress',form.address); set('#fManager',form.manager);
  form.mins = +form.mins || 0;
  $('#fHour').value = form.mins ? Math.floor(form.mins/60) : '';
  $('#fMin').value  = form.mins ? (form.mins%60) : '';
  const readMins = ()=>{
    const h = Math.max(0, Math.min(24, +$('#fHour').value||0));
    const m = Math.max(0, Math.min(59, +$('#fMin').value||0));
    form.mins = h*60 + m; hourHint();
  };
  $('#fHour').addEventListener('input', readMins);
  $('#fMin').addEventListener('input', readMins);
  set('#fEntry',form.entry); set('#fParking',form.parking); set('#fWork',form.work);
  set('#fBizno',form.bizno); set('#fEmail',form.email); set('#fClient',form.client);
  set('#fStart',form.startDate);
  set('#fAnchor',form.rep.anchor); set('#fMday',form.rep.day);
  $('#fAmount').value = form.amount ? won(form.amount) : '';

  ['fName','fAddress','fManager','fEmail','fClient','fEntry','fParking','fWork'].forEach(idn=>{
    const k = idn.slice(1).charAt(0).toLowerCase()+idn.slice(2);
    $('#'+idn).addEventListener('input', e=>{ form[k] = e.target.value; });
  });
  $('#fBizno').addEventListener('input', e=>{
    const d = String(e.target.value).replace(/[^0-9]/g,'').slice(0,10);
    let t = d;
    if(d.length > 5) t = d.slice(0,3)+'-'+d.slice(3,5)+'-'+d.slice(5);
    else if(d.length > 3) t = d.slice(0,3)+'-'+d.slice(3);
    e.target.value = t; form.bizno = t;
  });
  $('#fAmount').addEventListener('input', e=>{
    form.amount = parseAmt(e.target.value);
    e.target.value = form.amount ? won(form.amount) : '';
    billHint();
  });
  $('#fStart').addEventListener('change', e=>{ form.startDate = e.target.value; });
  $('#fAnchor').addEventListener('change', e=>{ form.rep.anchor = e.target.value; });
  $('#fMday').addEventListener('input', e=>{ form.rep.day = Math.max(1, Math.min(31, +e.target.value||1)); });

  const segPick = (wrap, cur, cb) => {
    const w = $(wrap); if(!w) return;
    w.querySelectorAll('button').forEach(b=>{
      b.classList.toggle('on', String(b.dataset.v)===String(cur));
      b.onclick = ()=>{ w.querySelectorAll('button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); cb(b.dataset.v); };
    });
  };
  const dawnUI = v=>{
    $('#dawnHint').style.display = v==='dawn'?'block':'none';
    $('#dowLabel').textContent = v==='dawn' ? '요일 (청소하는 새벽 요일)' : '요일';
  };
  segPick('#fSlot', form.slot, v=>{ form.slot = v; dawnUI(v); });
  dawnUI(form.slot);
  segPick('#fRep', form.rep.type, v=>{ form.rep.type = v; repVis(); });
  segPick('#fNth', form.rep.nth, v=>{ form.rep.nth = +v; });
  segPick('#fNthDow', form.rep.weekday, v=>{ form.rep.weekday = +v; });
  segPick('#fBilling', form.billing, v=>{ form.billing = v; billHint(); });

  const dw = $('#fDows');
  dw.querySelectorAll('button').forEach(b=>{
    const i = +b.dataset.v;
    b.classList.toggle('on', form.rep.days.includes(i));
    b.onclick = ()=>{
      const k = form.rep.days.indexOf(i);
      if(k>=0) form.rep.days.splice(k,1); else form.rep.days.push(i);
      b.classList.toggle('on');
    };
  });

  const sw = (sel,key)=>{ const e=$(sel); e.classList.toggle('on', !!form[key]); e.onclick=()=>{ form[key]=!form[key]; e.classList.toggle('on', form[key]); }; };
  sw('#fInvoice','invoice'); sw('#fPaused','paused');

  if(!Number.isInteger(form.color)) form.color = nextColorIdx(form.id);
  const cw = $('#fColor');
  if(cw){
    const paint = () => cw.querySelectorAll('button').forEach(b2=>b2.classList.toggle('on', +b2.dataset.v === colorIdxOf(form)));
    cw.querySelectorAll('button').forEach(b2=>{
      b2.addEventListener('click', ()=>{ form.color = +b2.dataset.v; paint(); });
    });
    paint();
  }

  drawDates(); repVis(); billHint(); hourHint();
}
function hourHint(){
  const e = $('#hourHint'); if(!e) return;
  const m = +form.mins || 0;
  if(!m){ e.textContent = '비워두면 시간당 계산을 하지 않습니다.'; return; }
  const per = form.billing==='per' ? parseAmt(form.amount) : 0;
  const txt = `1회 ${Math.floor(m/60)?Math.floor(m/60)+'시간 ':''}${m%60?m%60+'분':''}`.trim();
  e.innerHTML = `${txt} — 정산금액 탭에서 그 달 방문 횟수로 <b>시간당 얼마</b>인지 계산해 보여줍니다.`;
}
function billHint(){
  const e = $('#billHint'); if(!e) return;
  e.innerHTML = form.billing==='per'
    ? `그 달에 실제로 잡힌 횟수만큼 곱해집니다. 예) ${won(form.amount||50000)}원 × 3회 = <b>${won((form.amount||50000)*3)}원</b>`
    : `그 달에 일정이 있으면 <b>${won(form.amount||0)}원</b>이 한 번만 더해집니다. 주5일이어도 똑같습니다.`;
}
function repVis(){
  const t = form.rep.type;
  $('#wrapDows').style.display   = (t==='weekly'||t==='biweekly') ? 'block':'none';
  $('#wrapAnchor').style.display = (t==='biweekly') ? 'block':'none';
  $('#wrapMday').style.display   = (t==='monthly_date') ? 'block':'none';
  $('#wrapNth').style.display    = (t==='monthly_nth') ? 'block':'none';
  $('#wrapDates').style.display  = (t==='dates') ? 'block':'none';
}
function drawDates(){
  const box = $('#datesList'); if(!box) return;
  const ds = form.rep.dates.slice().sort();
  box.innerHTML = ds.length
    ? ds.map(d=>`<span class="datechip">${esc(labelDate(d))} <b onclick="delRepDate('${d}')">✕</b></span>`).join('')
    : `<div class="hint" style="margin:0">아직 고른 날짜가 없습니다</div>`;
}
function addRepDate(){
  const v = $('#fDateAdd').value;
  if(!v){ toast('날짜를 골라 주세요'); return; }
  if(!form.rep.dates.includes(v)) form.rep.dates.push(v);
  $('#fDateAdd').value = '';
  drawDates();
}
function delRepDate(d){
  form.rep.dates = form.rep.dates.filter(x=>x!==d);
  drawDates();
}
function clearSkips(){ form.skips = []; toast('저장하면 반영됩니다'); }

function saveSite(){
  if(!form.name.trim()){ toast('현장명을 입력해 주세요'); return; }
  const t = form.rep.type;
  if((t==='weekly'||t==='biweekly') && !form.rep.days.length){ toast('요일을 선택해 주세요'); return; }
  if(t==='dates' && !form.rep.dates.length){ toast('지정 날짜를 하나 이상 골라 주세요'); return; }
  if(t==='biweekly' && !form.rep.anchor) form.rep.anchor = todayYmd();
  form.rep.days.sort();
  form.rep.dates.sort();
  delete form.price;
  const i = D.sites.findIndex(x=>x.id===form.id);
  if(i>=0) D.sites[i] = form; else D.sites.push(form);
  save(true); closeSheet(); closeBanner();
  panelOpen = false;                 /* 아래 상세 패널까지 닫고 달력으로 */
  render(); toast('저장했습니다');
}
function delSite(id){
  if(!confirm('이 현장을 삭제할까요? 달력에서 모두 사라집니다.')) return;
  D.sites = D.sites.filter(x=>x.id!==id);
  save(true); closeSheet(); closeBanner();
  panelOpen = false;
  render(); toast('삭제했습니다');
}

/* ---------- 휴가 기간 ---------- */
function openVacation(){
  const offCnt = Object.keys(D.offdays).length;
  openSheet('휴가 기간 지정', `
    <div class="field"><label>시작일</label><input type="date" id="vFrom"></div>
    <div class="field"><label>종료일</label><input type="date" id="vTo"></div>
    <div class="bn-actions">
      <button class="btn sec" onclick="applyVac(false)">휴무 해제</button>
      <button class="btn pri" onclick="applyVac(true)">휴무로 지정</button>
    </div>
    <div class="hint" style="margin-top:12px">현재 휴무로 표시된 날 ${offCnt}일.
      하루만 바꿀 때는 달력에서 날짜를 누른 뒤 아래 <b>휴무</b> 스위치를 쓰세요.</div>
  `);
}
function applyVac(on){
  const a = $('#vFrom').value, b = $('#vTo').value;
  if(!a || !b){ toast('시작일과 종료일을 골라 주세요'); return; }
  if(a > b){ toast('종료일이 시작일보다 빠릅니다'); return; }
  let d = parseYmd(a); const end = parseYmd(b); let n = 0;
  while(ymd(d) <= ymd(end)){
    if(on) D.offdays[ymd(d)] = true; else delete D.offdays[ymd(d)];
    d = addDays(d,1); n++;
    if(n > 400) break;
  }
  save(true); closeSheet(); render();
  toast(on ? `${n}일을 휴무로 표시했습니다` : `${n}일의 휴무를 해제했습니다`);
}

/* ---------- 메뉴 / 백업 ---------- */
function startSearch(){ closeSheet(); SEARCH_ON = true; searchQ=''; panelOpen=false; render(); setTimeout(()=>{ const q=$('#qInput'); if(q) q.focus(); },80); }
function endSearch(){ SEARCH_ON = false; searchQ=''; render(); }
function openMenu(){
  closeBanner();
  const cnt = D.sites.length, oc = Object.keys(D.once).length, mc = Object.keys(D.personal).length;
  openSheet('설정', `
    ${backupOverdue() ? `<div class="bkwarn">${daysSinceBackup()===null
        ? '아직 <b>백업을 한 번도 안 하셨습니다.</b> 이 앱의 데이터는 이 브라우저 안에만 있어서, 방문기록을 지우거나 폰을 바꾸면 전부 사라집니다.'
        : `마지막 백업이 <b>${daysSinceBackup()}일 전</b>입니다. 그 사이 입력하신 내용은 아직 어디에도 저장돼 있지 않습니다.`}<br>
      아래 <b>백업 파일 내보내기</b>를 한 번 눌러 주세요.</div>` : ''}
    <button class="btn pri" style="margin-bottom:10px" onclick="openSiteList()">현장 관리 (${cnt}곳)</button>
    <div class="swrow" style="margin-bottom:10px">
      <div><b>달력 색을 현장별로</b><div class="hint">끄면 예전처럼 시간대(아침·오후·저녁) 색으로 보입니다</div></div>
      <div class="sw ${bySite()?'on':''}" onclick="toggleColorBy(this)"></div>
    </div>
    <button class="btn sec" style="margin-bottom:10px" onclick="startSearch()">현장·메모 검색</button>
    <button class="btn sec" style="margin-bottom:10px" onclick="openVacation()">휴가 기간 지정</button>
    <button class="btn sec" style="margin-bottom:10px" onclick="exportData()">백업 파일 내보내기</button>
    <button class="btn sec" style="margin-bottom:10px" onclick="document.getElementById('importFile').click()">백업 파일 불러오기</button>
    <button class="btn sec" style="margin-bottom:10px" onclick="openImportText()">붙여넣기로 되살리기</button>
    <input type="file" id="importFile" accept="application/json,.json,text/plain" style="display:none">
    <div class="hint" style="margin-top:6px">
      현장 ${cnt}곳 · 일회성 ${oc}건 · 개인 일정 ${mc}일 · 경비 ${Object.keys(D.expense).length}일<br><br>
      데이터는 이 기기의 브라우저에 저장됩니다. 기기를 바꾸거나 브라우저 데이터를 지우면 사라지니,
      가끔 <b>백업 파일 내보내기</b>로 파일을 보관해 두세요.
    </div>
    <div class="hint" style="margin-top:14px">
      <b>홈 화면에 추가</b> — 아이폰: 공유 → 홈 화면에 추가 / 안드로이드: 메뉴 → 앱 설치. 앱처럼 전체화면으로 열립니다.
    </div>
    <div class="hint" style="margin-top:14px">공휴일은 2026~2030년까지 들어 있습니다.</div>
  `, ()=>{
    $('#importFile').addEventListener('change', e=>{
      const f = e.target.files[0]; if(!f) return;
      const r = new FileReader();
      r.onload = () => {
        try{
          const p = JSON.parse(r.result);
          if(!p || typeof p!=='object' || !('sites' in p)) throw 0;
          if(!confirm('현재 데이터를 이 백업으로 덮어씁니다. 계속할까요?')) return;
          D = Object.assign(structuredClone(DEFAULT_DATA), p);
          D.personal = D.personal || {}; D.expense = D.expense || {}; D.order = D.order || {}; D.memos = D.memos || {};
          save(true); closeSheet(); location.reload();
        }catch(err){ toast('백업 파일이 아닙니다'); }
      };
      r.readAsText(f);
    });
  });
}
/* ---------- 백업 알림 ---------- */
function markBackup(){ D.ui.lastBackup = todayYmd(); save(true); refreshBackupBadge(); }
function daysSinceBackup(){
  const b = D.ui.lastBackup;
  if(!b) return null;                                   /* 한 번도 안 했음 */
  return Math.max(0, Math.round((parseYmd(todayYmd()) - parseYmd(b)) / 86400000));
}
/* 데이터가 있는데 30일 넘게 백업을 안 했으면 경고 */
function backupOverdue(){
  if(!D.sites.length && !Object.keys(D.once).length && !Object.keys(D.personal).length && !Object.keys(D.expense).length) return false;
  const n = daysSinceBackup();
  return n === null || n >= 30;
}
function refreshBackupBadge(){
  const b = $('#btnMenu'); if(b) b.classList.toggle('warn', backupOverdue());
}

const backupName = () => `cleandiary-backup-${todayYmd()}.json`;
const backupJson = () => JSON.stringify(D, null, 2);

function exportData(){
  const json = backupJson();
  openSheet('백업 내보내기', `
    <div class="hint" style="margin:0 0 12px">휴대폰에서는 방법에 따라 저장이 막히기도 합니다.
      <b>공유하기</b>가 가장 잘 되고, 안 되면 <b>글로 복사</b>해서 메모장이나 카톡 내게쓰기에 붙여넣어 두세요. 그 글만 있으면 그대로 되살릴 수 있습니다.</div>
    <button class="btn pri" style="margin-bottom:10px" onclick="shareBackup()">공유하기 (카톡·메모·파일 앱)</button>
    <button class="btn sec" style="margin-bottom:10px" onclick="downloadBackup()">파일로 다운로드</button>
    <button class="btn sec" style="margin-bottom:10px" onclick="copyBackup()">백업 내용 글로 복사</button>
    <div class="field" style="margin-top:6px"><label>백업 내용 (길게 눌러 전체 선택해도 됩니다)</label>
      <textarea id="bkTa" style="min-height:150px;font-size:11px" readonly></textarea></div>
    <div class="hint">현장 ${D.sites.length}곳 · 일회성 ${Object.keys(D.once).length}건 · 개인 일정 ${Object.keys(D.personal).length}일 · 경비 ${Object.keys(D.expense).length}일</div>
  `, ()=>{ $('#bkTa').value = json; });
}
function shareBackup(){
  const json = backupJson(), name = backupName();
  try{
    const file = new File([json], name, { type:'application/json' });
    if(navigator.canShare && navigator.canShare({ files:[file] })){
      navigator.share({ files:[file], title:name })
        .then(()=>{ markBackup(); toast('내보냈습니다'); })
        .catch(()=>{});
      return;
    }
    if(navigator.share){
      navigator.share({ title:name, text:json }).then(()=>markBackup(), ()=>{});
      return;
    }
  }catch(e){}
  toast('이 브라우저는 공유를 지원하지 않습니다');
}
function downloadBackup(){
  const json = backupJson(), name = backupName();
  try{
    const blob = new Blob([json], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name; a.rel = 'noopener';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
    markBackup();
    toast('저장 목록을 확인해 보세요');
  }catch(e){ toast('다운로드가 막혀 있습니다. 글로 복사를 써주세요'); }
}
function copyBackup(){ copyText(backupJson(), '백업 내용을 복사했습니다'); markBackup(); }

function openImportText(){
  openSheet('붙여넣기로 되살리기', `
    <div class="hint" style="margin:0 0 12px">복사해 둔 백업 내용을 아래에 붙여넣고 되살리기를 누르세요.</div>
    <div class="field"><textarea id="imTa" style="min-height:180px;font-size:11px" placeholder="여기에 붙여넣기"></textarea></div>
    <button class="btn pri" onclick="applyImportText()">되살리기</button>
  `);
}
function applyImportText(){
  const t = ($('#imTa').value||'').trim();
  if(!t){ toast('내용을 붙여넣어 주세요'); return; }
  try{
    const p = JSON.parse(t);
    if(!p || typeof p!=='object' || !('sites' in p)) throw 0;
    if(!confirm('현재 데이터를 이 백업으로 덮어씁니다. 계속할까요?')) return;
    D = Object.assign(structuredClone(DEFAULT_DATA), p);
    save(true); closeSheet(); location.reload();
  }catch(e){ toast('백업 내용이 아닙니다' ); }
}

/* ---------- 내비게이션 ---------- */
function clampSel(){
  const a = ymd(anchor), b = ymd(addDays(anchor,20));
  if(SEL < a || SEL > b) SEL = a;
}
function moveMonths(n){
  const d = new Date(SMY, SMM + n, 1);
  SMY = d.getFullYear(); SMM = d.getMonth();
  render();
}
function moveWeeks(n){
  if(TAB===3){ moveMonths(n); return; }
  const wk = calwrap.querySelector('.week');
  const step = wk ? (wk.offsetHeight + 4) * 3 : 300;      /* 한 번에 3주 */
  calwrap.scrollBy({ top: n * step, behavior:'smooth' });
}
$('#btnPrev').onclick  = ()=>moveWeeks(-1);
$('#btnNext').onclick  = ()=>moveWeeks(1);
$('#btnToday').onclick = ()=>{
  if(TAB===3){ const n=new Date(); SMY=n.getFullYear(); SMM=n.getMonth(); render(); return; }
  SEL = todayYmd(); searchQ=''; panelOpen=false; closeBanner(); render(); scrollToDate(todayYmd(), true);
};
$('#btnMenu').onclick  = openMenu;
document.querySelectorAll('.tab').forEach(b=>{
  b.onclick = ()=>{
    TAB = +b.dataset.tab; D.ui.tab = TAB; save();
    searchQ=''; SEARCH_ON=false; panelOpen=false; ORDER_MODE=false; PERS_EDIT=null; EXP_EDIT=null;
    closeBanner(); render();
    if(TAB!==3) scrollToDate(SEL || todayYmd());
  };
});

/* ---------- 길게 눌러 완료 토글 ---------- */
let lpTimer = null, lpFired = false;
function lpTarget(t){
  const ev = t.closest && t.closest('.ev'); if(!ev) return null;
  const cell = ev.closest('.cell'); if(!cell) return null;
  const date = ev.dataset.date || cell.dataset.date;
  const id = ev.dataset.id || (ev.classList.contains('once') ? '__once' : null);
  return (date && id) ? { date, id, ev } : null;
}
function lpStart(e){
  lpFired = false;                 /* 새로 누를 때마다 초기화 — 안 하면 다음 탭이 씹힙니다 */
  if(TAB !== 0) return;
  const t = lpTarget(e.target); if(!t) return;
  clearTimeout(lpTimer);
  lpTimer = setTimeout(()=>{
    lpFired = true;
    const sk = D.sites.find(x=>x.id===t.id);
    if(sk && isSkipped(sk, parseYmd(t.date))){
      clearTimeout(siteTapTimer); siteTapTimer = null; siteTapKey = null;
      toast('건너뛴 날은 완료로 표시할 수 없습니다'); return;
    }
    const on = toggleDone(t.date, t.id);
    if(navigator.vibrate) navigator.vibrate(on ? 18 : 8);
    clearTimeout(siteTapTimer); siteTapTimer = null; siteTapKey = null;   /* 배너가 뒤늦게 안 뜨게 */
    renderCal(); renderPanel();
    const nm = t.id==='__once' ? '일회성' : ((D.sites.find(x=>x.id===t.id)||{}).name || '');
    toast(on ? `${nm} 완료` : `${nm} 완료 취소`);
  }, 500);
}
function lpCancel(){ clearTimeout(lpTimer); lpTimer = null; }
calwrap.addEventListener('touchstart', lpStart, {passive:true});
calwrap.addEventListener('touchmove',  lpCancel, {passive:true});
calwrap.addEventListener('touchend',   lpCancel, {passive:true});
calwrap.addEventListener('mousedown',  lpStart);
calwrap.addEventListener('mouseup',    lpCancel);
calwrap.addEventListener('mouseleave', lpCancel);
/* 길게 눌러서 처리했으면 그 다음 클릭은 삼킵니다 */
calwrap.addEventListener('click', e=>{ if(lpFired){ e.stopPropagation(); e.preventDefault(); lpFired = false; } }, true);
/* 길게 누를 때 뜨는 브라우저 메뉴 막기 */
calwrap.addEventListener('contextmenu', e=>{ if(lpTarget(e.target)) e.preventDefault(); });

/* 좌우 스와이프로 이동 */
let tx=0, ty=0;
calwrap.addEventListener('touchstart', e=>{ tx=e.touches[0].clientX; ty=e.touches[0].clientY; }, {passive:true});
calwrap.addEventListener('touchend', e=>{
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if(Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy)*1.5) moveWeeks(dx<0 ? 1 : -1);
}, {passive:true});

/* 홈 화면 추가용 매니페스트 (파일 없이 동작) */
(function(){
  const icon = "data:image/svg+xml;base64," + btoa(unescape(encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="112" fill="#0f172a"/><rect x="104" y="144" width="304" height="256" rx="40" fill="none" stroke="#38bdf8" stroke-width="28"/><path d="M104 224h304" stroke="#38bdf8" stroke-width="28"/><path d="M184 112v64M328 112v64" stroke="#38bdf8" stroke-width="28" stroke-linecap="round"/></svg>`)));
  const mf = { name:"cleandiary", short_name:"cleandiary", start_url:".", display:"standalone",
    background_color:"#f1f5f9", theme_color:"#0f172a",
    icons:[{src:icon, sizes:"512x512", type:"image/svg+xml", purpose:"any maskable"}] };
  const l = document.createElement('link');
  l.rel = 'manifest';
  l.href = URL.createObjectURL(new Blob([JSON.stringify(mf)], {type:'application/manifest+json'}));
  document.head.appendChild(l);
  const al = document.createElement('link');
  al.rel = 'apple-touch-icon'; al.href = icon; document.head.appendChild(al);
  if('serviceWorker' in navigator && location.protocol.startsWith('http')){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
})();

function toggleColorBy(el){
  D.ui.colorBy = bySite() ? 'slot' : 'site';
  el.classList.toggle('on', bySite());
  save(true); render();
  toast(bySite() ? '현장별 색으로 표시합니다' : '시간대 색으로 표시합니다');
}

window.addEventListener('resize', ()=>{ const b = WKH; fitWeeks(); if(WKH !== b) renderCal(); });
window.addEventListener('beforeunload', ()=>save(true));
migrateColors();
migrateMemos();
ensureSince();
render();
setTimeout(()=>{ if(TAB!==3 && !SEARCH_ON) scrollToDate(SEL || todayYmd()); }, 40);
refreshBackupBadge();
</script>
</body>
