<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="cleandiary">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f172a'/%3E%3Crect x='13' y='18' width='38' height='32' rx='5' fill='none' stroke='%2338bdf8' stroke-width='4'/%3E%3Cpath d='M13 28h38' stroke='%2338bdf8' stroke-width='4'/%3E%3Cpath d='M23 14v8M41 14v8' stroke='%2338bdf8' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<title>cleandiary</title>
<style>
:root{
  --bg:#f1f5f9; --card:#ffffff; --ink:#0f172a; --sub:#64748b; --line:#e2e8f0;
  --accent:#0ea5e9; --dark:#0f172a;
  --morning:#f59e0b; --afternoon:#3b82f6; --evening:#8b5cf6; --dawn:#1e293b; --once:#059669;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overscroll-behavior:none}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  background:var(--bg); color:var(--ink); font-size:15px; line-height:1.4;
}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{border:none;background:none;cursor:pointer;padding:0}

#app{display:flex;flex-direction:column;height:100dvh;max-width:600px;margin:0 auto;background:var(--bg);position:relative;overflow:hidden}

/* ---------- top bar ---------- */
.topbar{
  flex:0 0 auto;display:flex;align-items:center;gap:6px;
  padding:calc(var(--safe-t) + 8px) 10px 8px;background:var(--dark);color:#fff;
}
.topbar .title{font-weight:700;font-size:16px;letter-spacing:.3px}
.topbar .range{font-size:12px;color:#94a3b8;margin-left:2px}
.topbar .range.big{font-size:13.5px;color:#e2e8f0;font-weight:800}
.topbar .sp{flex:1}
.tb-btn{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:#1e293b;color:#e2e8f0}
.tb-btn:active{background:#334155}
.tb-btn.wide{width:auto;padding:0 10px;font-size:12px;font-weight:600}
.tb-btn{position:relative}
.tb-btn.warn::after{content:"";position:absolute;top:4px;right:4px;width:8px;height:8px;
  border-radius:50%;background:#ef4444;box-shadow:0 0 0 2px #1e293b}
.bkwarn{background:#fef2f2;border:1.5px solid #fecaca;color:#991b1b;border-radius:12px;
  padding:11px 12px;font-size:12.5px;font-weight:700;line-height:1.5;margin-bottom:12px}

/* ---------- banner ---------- */
.banner{
  position:absolute;left:0;right:0;top:0;z-index:40;
  background:var(--card);border-radius:0 0 18px 18px;box-shadow:0 12px 30px rgba(15,23,42,.25);
  max-height:0;overflow:hidden;transition:max-height .22s ease;
}
.banner.open{max-height:82dvh;overflow-y:auto}
.banner-inner{padding:calc(var(--safe-t) + 14px) 16px 18px}
.bn-head{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.bn-title{font-size:19px;font-weight:800;line-height:1.25;flex:1;word-break:break-all}
.bn-close{width:30px;height:30px;border-radius:50%;background:#f1f5f9;color:#475569;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.bn-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:#f1f5f9;color:#475569}
.chip.c-morning{background:#fef3c7;color:#92400e}
.chip.c-afternoon{background:#dbeafe;color:#1e40af}
.chip.c-evening{background:#ede9fe;color:#5b21b6}
.chip.c-dawn{background:#0f172a;color:#e0f2fe}
.chip.c-once{background:#d1fae5;color:#065f46}
.chip.c-warn{background:#fee2e2;color:#991b1b}
.chip.c-hol{background:#fee2e2;color:#b91c1b}
.bn-rows{border-top:1px solid var(--line)}
.bn-row{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.bn-row .k{flex:0 0 74px;color:var(--sub);font-size:13px;font-weight:600}
.bn-row .v{flex:1;font-size:14.5px;white-space:pre-wrap;word-break:break-all}
/* 현장 방문 기록 */
.hist{margin-top:14px}
.hist .t{font-size:12px;font-weight:800;color:var(--sub);margin-bottom:7px}
.histrow{display:flex;gap:9px;padding:8px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.histrow .hd{flex:0 0 82px;font-size:12.5px;font-weight:800;color:#334155}
.histrow .hd small{display:block;font-weight:700;color:#94a3b8;font-size:10.5px}
.histrow .hm{flex:1;font-size:13px;color:#475569;white-space:pre-wrap;word-break:break-all}
.histrow .hm.none{color:#cbd5e1}
.histdone{font-size:10px;font-weight:800;color:#059669}
.miniacts{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap}
.miniacts button{font-size:11.5px;font-weight:800;padding:6px 11px;border-radius:8px;background:#f1f5f9;color:#334155}
.miniacts button.kakao{background:#fef9c3;color:#854d0e}
.miniacts button.naver{background:#dcfce7;color:#166534}
.miniacts button.tmap{background:#e0e7ff;color:#3730a3}
.bn-actions{display:flex;gap:8px;margin-top:14px}
.btn{flex:1;height:42px;border-radius:11px;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:5px}
.btn.pri{background:var(--dark);color:#fff}
.btn.sec{background:#f1f5f9;color:#334155}
.btn.dan{background:#fef2f2;color:#b91c1c}
.backdrop{position:absolute;inset:0;background:rgba(15,23,42,.35);z-index:35;opacity:0;pointer-events:none;transition:opacity .2s}
.backdrop.on{opacity:1;pointer-events:auto}

/* ---------- calendar ---------- */
.calwrap{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 6px 4px;
  display:flex;flex-direction:column}
.calwrap.list{display:block}
.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px}
.dow div{text-align:center;font-size:11px;font-weight:800;color:var(--sub);padding:2px 0}
.dow div:first-child{color:#dc2626}
.dow div:last-child{color:#2563eb}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px;flex:1 1 0;min-height:84px}
.calwrap.list .week{flex:none}
.calwrap.compact .week{min-height:106px}
.dow,.legend,.searchbar{flex:0 0 auto}
.cell{
  background:var(--card);border-radius:10px;padding:3px 2px 4px;min-height:84px;
  border:1px solid transparent;display:flex;flex-direction:column;gap:2px;overflow:hidden;
}
.cell.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.cell.sel{border-color:var(--dark);box-shadow:0 0 0 1.5px var(--dark) inset}
.cell.other{background:#f8fafc}
.cell.off{background:repeating-linear-gradient(45deg,#fff,#fff 5px,#e9eef5 5px,#e9eef5 10px)}
.cell .dnum{font-size:11.5px;font-weight:800;color:var(--sub);text-align:center;padding:2px 0 3px;border-radius:6px}
.cell.today .dnum{background:var(--accent);color:#fff}
.cell.sun .dnum{color:#dc2626}
.cell.sat .dnum{color:#2563eb}
.cell.hol .dnum{color:#dc2626}
.cell.today.sun .dnum,.cell.today.sat .dnum,.cell.today.hol .dnum{color:#fff}
.holname{font-size:8.5px;font-weight:800;color:#dc2626;text-align:center;letter-spacing:-.6px;
  margin-top:-3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.offname{font-size:8.5px;font-weight:800;color:#475569;text-align:center;letter-spacing:-.6px;margin-top:-3px}
.ev{
  font-size:10px;font-weight:800;line-height:1.3;letter-spacing:-.4px;
  padding:3px 2px 3px 4px;border-radius:4px;background:#f8fafc;color:#0f172a;
  border-left:3px solid #cbd5e1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.ev.s-morning{background:#fffbeb;border-left-color:var(--morning)}
.ev.s-afternoon{background:#eff6ff;border-left-color:var(--afternoon)}
.ev.s-evening{background:#f5f3ff;border-left-color:var(--evening)}
.ev.s-dawn{background:#0f172a;color:#e0f2fe;border:1px dashed #38bdf8;border-left:3px solid #38bdf8;padding-left:3px}
.ev.once{background:#ecfdf5;color:#065f46;border:1px dashed #10b981;border-left:3px solid #10b981;padding-left:3px}
.ev.s-dawn{font-size:10px;letter-spacing:-.6px;padding-left:3px;padding-right:1px}
/* 전날 밤에 출발한다는 표시 — 오른쪽을 향하는 삼각형 (글꼴과 무관하게 항상 보임) */
.ev.s-dawn::before{
  content:"";display:inline-block;vertical-align:middle;margin:-1px 3px 0 0;
  width:0;height:0;border-top:3.5px solid transparent;border-bottom:3.5px solid transparent;
  border-left:5px solid #38bdf8;
}
/* 현장별 색 모드 — --c(진한색) --cbg(연한 배경) --cink(글자색)을 인라인으로 받음 */
.ev.sc{background:var(--cbg);color:var(--cink);border-left-color:var(--c)}
.ev.sc.s-dawn{background:#0f172a;color:#e0f2fe;border:1px dashed var(--c);border-left:3px solid var(--c)}
.ev.sc.s-dawn::before{border-left-color:var(--c)}
/* 완료 — 왼쪽 색 막대만 회색으로 (칸 공간을 전혀 쓰지 않음) */
.ev.done{border-left-color:#cbd5e1!important;opacity:.62}
.ev.done.s-dawn{border-color:#64748b!important;border-left-color:#64748b!important;opacity:.5}
.ev.done.s-dawn::before{border-left-color:#94a3b8!important}
.ev.once.done{border-color:#cbd5e1!important;border-left-color:#cbd5e1!important}
.dp-item.done .bar{background:#cbd5e1!important}
.dp-item.done .n{color:#94a3b8}
.cell.alldone .dnum{color:#94a3b8}
.dp-done{margin-left:auto;flex:0 0 auto;font-size:11px;font-weight:800;padding:5px 9px;border-radius:8px;
  background:#f1f5f9;color:#64748b;border:1.5px solid #e2e8f0}
.dp-done.on{background:#0f172a;color:#fff;border-color:#0f172a}
.swatches{display:flex;flex-wrap:wrap;gap:7px}
.swatches button{width:30px;height:30px;border-radius:9px;border:3px solid transparent;flex:0 0 auto}
.swatches button.on{border-color:#0f172a;transform:scale(1.06)}
.dp-item.dawn .n::before{
  content:"";display:inline-block;vertical-align:middle;margin:-2px 6px 0 0;
  width:0;height:0;border-top:5px solid transparent;border-bottom:5px solid transparent;
  border-left:7px solid #38bdf8;
}
.lg-dawn{width:0!important;height:0!important;border-top:4px solid transparent!important;
  border-bottom:4px solid transparent!important;border-left:6px solid #38bdf8!important;
  border-right:0!important;border-radius:0!important;background:none!important}
.evmore{font-size:9px;font-weight:800;color:var(--sub);text-align:center}
.dawnsep{height:0;border-top:2px dotted #94a3b8;margin:2px 1px 1px}

/* ---------- day panel ---------- */
.daypanel{display:none}
.daypanel.open{
  display:block;flex:0 0 auto;max-height:52dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:var(--card);border-radius:16px 16px 0 0;padding:12px 14px 14px;
  box-shadow:0 -8px 24px rgba(15,23,42,.14);animation:slideup .18s ease;
}
@keyframes slideup{from{transform:translateY(14px);opacity:.4}to{transform:none;opacity:1}}
.dp-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.dp-date{font-size:15px;font-weight:800}
.dp-sub{font-size:11.5px;color:var(--sub);font-weight:700}
.dp-sp{flex:1}
.dp-add{background:var(--dark);color:#fff;font-size:12px;font-weight:800;padding:7px 12px;border-radius:9px}
.dp-share{background:#e2e8f0;color:#334155;font-size:12px;font-weight:800;padding:7px 10px;border-radius:9px}
.dp-item{display:flex;align-items:center;gap:9px;padding:10px 2px;border-bottom:1px solid var(--line)}
.dp-item .bar{width:4px;height:26px;border-radius:2px;flex:0 0 auto}
.dp-item .m{flex:1;min-width:0}
.dp-item .n{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dp-item .s{font-size:11.5px;color:var(--sub);font-weight:700}
.dp-item.dawn{background:#0f172a;color:#e0f2fe;border-radius:9px;padding:10px;border-bottom:none;margin:4px 0}
.dp-item.dawn .s{color:#7dd3fc}
.dp-item.once{background:#ecfdf5;border-radius:9px;padding:10px;border:1px dashed #10b981;border-bottom:1px dashed #10b981;margin:4px 0}
.dp-note{font-size:11.5px;color:var(--sub);font-weight:700;margin:12px 0 4px}
.dp-ta{width:100%;border:1px solid var(--line);background:#f8fafc;border-radius:10px;padding:11px 12px;outline:none;min-height:110px;resize:vertical}
.dp-ta:focus{border-color:var(--accent);background:#fff}
.dp-in{width:100%;border:1px solid var(--line);background:#f8fafc;border-radius:10px;padding:11px 12px;outline:none}
.dp-in:focus{border-color:var(--accent);background:#fff}
.memodot{width:6px;height:6px;border-radius:50%;background:var(--accent);margin:4px auto 0}
.memoprev{font-size:9.5px;color:var(--sub);padding:0 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}

/* legend */
.legend{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;padding:6px 4px 2px}
.legend span{font-size:10px;font-weight:700;color:var(--sub);display:flex;align-items:center;gap:3px}
.legend i{width:9px;height:9px;border-radius:3px;display:inline-block}

/* ---------- tabbar ---------- */
.tabbar{
  flex:0 0 auto;display:grid;grid-template-columns:repeat(4,1fr);
  background:var(--card);border-top:1px solid var(--line);
  padding:6px 0 calc(var(--safe-b) + 6px);
}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;color:#94a3b8;padding:2px 0}
.tab.on{color:var(--dark)}
.tab .lb{font-size:10px;font-weight:800}
.tab svg{width:21px;height:21px}

/* ---------- settlement ---------- */
.stsec{font-size:12px;font-weight:800;color:var(--sub);padding:12px 8px 6px;display:flex;align-items:center;gap:6px}
.strow{background:var(--card);border-radius:11px;padding:10px 12px;margin:0 6px 7px}
.strow.late{box-shadow:inset 3px 0 0 #ef4444}
.latetag{display:inline-block;font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:999px;
  background:#fee2e2;color:#b91c1c;margin-left:6px;vertical-align:1px}
.latebox{background:#fef2f2;border:1.5px solid #fecaca;border-radius:12px;margin:0 6px 10px;padding:11px 12px}
.latebox .lt{font-size:12px;font-weight:800;color:#b91c1c;margin-bottom:6px}
.latebox .li{font-size:13px;font-weight:700;color:#7f1d1d;padding:3px 0}
.strow .top{display:flex;align-items:baseline;gap:8px}
.strow .n{font-weight:800;font-size:14.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.strow .a{font-weight:800;font-size:15px;white-space:nowrap}
.strow .s{font-size:11.5px;color:var(--sub);font-weight:700;margin-top:3px}
.strow .cks{display:flex;gap:6px;margin-top:9px}
.ck{font-size:11.5px;font-weight:800;padding:6px 12px;border-radius:999px;background:#f1f5f9;color:#94a3b8;display:flex;align-items:center;gap:4px}
.ck.inv.on{background:#dbeafe;color:#1d4ed8}
.ck.paid.on{background:#d1fae5;color:#047857}
.sttot{display:flex;justify-content:space-between;align-items:center;background:var(--dark);color:#fff;
  border-radius:12px;padding:12px 14px;margin:3px 6px 6px;font-weight:800;font-size:15px}
.stsum{display:flex;gap:6px;margin:0 6px 14px}
.stsum div{flex:1;background:var(--card);border-radius:10px;padding:9px 10px;font-size:11.5px;font-weight:800;color:var(--sub)}
.stsum div b{display:block;font-size:14px;color:var(--ink);margin-top:3px}
.stsum div.paid b{color:#047857}
.stsum div.due b{color:#b91c1c}
.stgrand{display:flex;justify-content:space-between;align-items:center;background:#0ea5e9;color:#fff;
  border-radius:12px;padding:14px;margin:6px 6px 18px;font-weight:800;font-size:16px}

/* ---------- sheet (modal) ---------- */
.sheet{position:absolute;inset:0;z-index:60;display:none}
.sheet.on{display:block}
.sheet .sh-bd{position:absolute;inset:0;background:rgba(15,23,42,.45)}
.sheet .sh-panel{
  position:absolute;left:0;right:0;bottom:0;max-height:92dvh;background:var(--card);
  border-radius:18px 18px 0 0;display:flex;flex-direction:column;
}
.sh-head{display:flex;align-items:center;gap:8px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.sh-head .t{font-weight:800;font-size:16px;flex:1}
.sh-body{overflow-y:auto;padding:14px 16px calc(var(--safe-b) + 16px);-webkit-overflow-scrolling:touch}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:800;color:var(--sub);margin-bottom:5px}
.field input[type=text],.field input[type=number],.field input[type=date],.field textarea,.field select{
  width:100%;border:1px solid var(--line);background:#f8fafc;border-radius:10px;padding:11px 12px;outline:none;
}
.field textarea{min-height:70px;resize:vertical}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent);background:#fff}
.seg{display:flex;gap:5px;flex-wrap:wrap}
.seg button{flex:1;min-width:60px;padding:9px 4px;border-radius:9px;background:#f1f5f9;font-size:13px;font-weight:700;color:#64748b}
.seg button.on{background:var(--dark);color:#fff}
.dows{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dows button{padding:9px 0;border-radius:9px;background:#f1f5f9;font-size:13px;font-weight:800;color:#64748b}
.dows button.on{background:var(--accent);color:#fff}
.swrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.sw{width:48px;height:28px;border-radius:999px;background:#cbd5e1;position:relative;transition:background .15s;flex:0 0 auto}
.sw.on{background:#10b981}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on::after{left:23px}
.hint{font-size:11.5px;color:var(--sub);margin-top:5px;line-height:1.45}
.siteitem{display:flex;align-items:center;gap:9px;padding:11px 2px;border-bottom:1px solid var(--line)}
.siteitem .bar{width:4px;height:30px;border-radius:2px;flex:0 0 auto}
.siteitem .m{flex:1;min-width:0}
.siteitem .n{font-weight:700;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.siteitem .d{font-size:11.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{text-align:center;color:var(--sub);font-size:13px;padding:34px 10px}
.searchbar{display:flex;gap:6px;padding:0 6px 8px}
.searchbar input{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;outline:none}
.result{background:var(--card);border-radius:11px;padding:11px 12px;margin:0 6px 7px}
.result .d{font-size:11.5px;font-weight:800;color:var(--accent);margin-bottom:3px}
.result .x{font-size:13.5px;white-space:pre-wrap;word-break:break-all}
.result.site{display:flex;align-items:center;gap:9px}
.result.site .bar{width:4px;height:30px;border-radius:2px;flex:0 0 auto}
.result.site .n{font-weight:800;font-size:14.5px}
.result.site .w{font-size:11.5px;color:var(--sub);font-weight:700;margin-top:2px}
.result mark{background:#fef08a;color:inherit;border-radius:3px;padding:0 1px}
.ressec{font-size:11.5px;font-weight:800;color:var(--sub);padding:10px 10px 6px}
.datechips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.datechip{font-size:12px;font-weight:800;padding:7px 10px;border-radius:9px;background:#e0f2fe;color:#0369a1;display:flex;align-items:center;gap:6px}

<body>
<div id="app">

      <span class="lb">정산금액</span>

  <div class="sheet" id="sheet"><div class="sh-bd" id="sheetBd"></div><div class="sh-panel"><div class="sh-head"><div class="t" id="sheetTitle"></div><button class="bn-close" id="sheetClose"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><div class="sh-body" id="sheetBody"></div></div></div>

  <div class="toast" id="toast"></div>

<script>
/* =========================================================
   cleandiary — 청소 스케줄 앱
   데이터는 이 기기의 브라우저 저장소(localStorage)에 저장됩니다.
   ========================================================= */

/* ---------- 대한민국 공휴일 2026~2030 (대체공휴일 포함) ---------- */
const HOLIDAYS = {
  '2026-01-01':'신정','2026-02-16':'설날','2026-02-17':'설날','2026-02-18':'설날',
  '2026-03-01':'삼일절','2026-03-02':'대체','2026-05-05':'어린이날',
  '2026-05-24':'석가탄신','2026-05-25':'대체','2026-06-06':'현충일',
  '2026-08-15':'광복절','2026-08-17':'대체',
  '2026-09-24':'추석','2026-09-25':'추석','2026-09-26':'추석',
  '2026-10-03':'개천절','2026-10-05':'대체','2026-10-09':'한글날','2026-12-25':'성탄절',

  '2027-01-01':'신정','2027-02-06':'설날','2027-02-07':'설날','2027-02-08':'설날','2027-02-09':'대체',
  '2027-03-01':'삼일절','2027-05-05':'어린이날','2027-05-13':'석가탄신','2027-06-06':'현충일',
  '2027-08-15':'광복절','2027-08-16':'대체',
  '2027-09-14':'추석','2027-09-15':'추석','2027-09-16':'추석',
  '2027-10-03':'개천절','2027-10-04':'대체','2027-10-09':'한글날','2027-10-11':'대체',
  '2027-12-25':'성탄절','2027-12-27':'대체',

  '2028-01-01':'신정','2028-01-26':'설날','2028-01-27':'설날','2028-01-28':'설날',
  '2028-03-01':'삼일절','2028-05-02':'석가탄신','2028-05-05':'어린이날','2028-06-06':'현충일',
  '2028-08-15':'광복절',
  '2028-10-02':'추석','2028-10-03':'추석','2028-10-04':'추석','2028-10-05':'대체',
  '2028-10-09':'한글날','2028-12-25':'성탄절',

  '2029-01-01':'신정','2029-02-12':'설날','2029-02-13':'설날','2029-02-14':'설날',
  '2029-03-01':'삼일절','2029-05-05':'어린이날','2029-05-07':'대체',
  '2029-05-20':'석가탄신','2029-05-21':'대체','2029-06-06':'현충일','2029-08-15':'광복절',
  '2029-09-21':'추석','2029-09-22':'추석','2029-09-23':'추석','2029-09-24':'대체',
  '2029-10-03':'개천절','2029-10-09':'한글날','2029-12-25':'성탄절',

  '2030-01-01':'신정','2030-02-02':'설날','2030-02-03':'설날','2030-02-04':'설날','2030-02-05':'대체',
  '2030-03-01':'삼일절','2030-05-05':'어린이날','2030-05-06':'대체','2030-05-09':'석가탄신',
  '2030-06-06':'현충일','2030-08-15':'광복절',
  '2030-09-11':'추석','2030-09-12':'추석','2030-09-13':'추석',
  '2030-10-03':'개천절','2030-10-09':'한글날','2030-12-25':'성탄절'
};
const holidayOf = s => HOLIDAYS[s] || null;

/* ---------- 저장소 ---------- */
const KEY = 'cleandiary.v1';
const DEFAULT_DATA = { sites: [], once: {}, memos: {}, offdays: {}, settle: {}, done: {}, ui: { tab: 0, colorBy: 'site', lastBackup: '' } };
let D = load();

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return structuredClone(DEFAULT_DATA);
    const p = JSON.parse(raw);
    const d = Object.assign(structuredClone(DEFAULT_DATA), p);
    d.ui = Object.assign({ tab:0, colorBy:'site', lastBackup:'' }, p.ui||{});   /* ui는 통째로 덮이지 않게 병합 */
    d.done = d.done || {};
    return d;
  }catch(e){ return structuredClone(DEFAULT_DATA); }
}
let saveTimer = null;
function save(now){
  clearTimeout(saveTimer);
  const doIt = () => { try{ localStorage.setItem(KEY, JSON.stringify(D)); }catch(e){ toast('저장 공간이 부족합니다'); } };
  if(now) doIt(); else saveTimer = setTimeout(doIt, 250);
}
const uid = () => Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4);

/* ---------- 금액 ---------- */
function parseAmt(t){
  if(t == null) return 0;
  if(typeof t === 'number') return Math.round(t) || 0;
  const s = String(t).replace(/,/g,'').replace(/\s/g,'');
  const eok = s.match(/(\d+(?:\.\d+)?)\s*억/);
  const man = s.match(/(\d+(?:\.\d+)?)\s*만/);
  if(eok || man) return Math.round((eok?parseFloat(eok[1])*1e8:0) + (man?parseFloat(man[1])*1e4:0));
  const n = s.match(/\d+/);
  return n ? +n[0] : 0;
}
const won = n => (Math.round(n)||0).toLocaleString('ko-KR');

/* ---------- 옛 데이터 맞추기 ---------- */
(function migrate(){
  D.offdays = D.offdays || {};
  D.settle  = D.settle  || {};
  (D.sites||[]).forEach(s=>{
    if(s.amount === undefined) s.amount = parseAmt(s.price);
    if(!s.billing) s.billing = 'monthly';
    s.rep = s.rep || {};
    if(!Array.isArray(s.rep.dates)) s.rep.dates = [];
  });
  Object.keys(D.once||{}).forEach(k=>{
    const v = D.once[k];
    if(typeof v === 'string'){
      const lines = v.split('\n').map(x=>x.trim()).filter(Boolean);
      if(!lines.length){ delete D.once[k]; return; }
      D.once[k] = { place: lines[0]||'', amount: 0, note: lines.slice(1).join('\n') };
    }else if(v && typeof v === 'object'){
      v.place = v.place||''; v.note = v.note||''; v.amount = parseAmt(v.amount);
    }else delete D.once[k];
  });
})();

/* ---------- 날짜 유틸 ---------- */
const DOW_KR = ['일','월','화','수','목','금','토'];
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (d,n) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate()+n); return x; };
const startOfWeek = d => addDays(d, -d.getDay());
const daysInMonth = (y,m) => new Date(y, m+1, 0).getDate();
const todayYmd = () => ymd(new Date());
function labelDate(s){ const d = parseYmd(s); return `${d.getMonth()+1}월 ${d.getDate()}일 (${DOW_KR[d.getDay()]})`; }

/* ---------- 시간대 ---------- */
const SLOTS = [
  { key:'morning',   name:'아침', hex:'#f59e0b' },
  { key:'afternoon', name:'오후', hex:'#3b82f6' },
  { key:'evening',   name:'저녁', hex:'#8b5cf6' },
  { key:'dawn',      name:'새벽', hex:'#38bdf8' }
];
const SLOT_ORDER = { morning:1, afternoon:2, evening:3, dawn:4 };
const slotName = k => (SLOTS.find(s=>s.key===k)||SLOTS[0]).name;
const slotHex  = k => (SLOTS.find(s=>s.key===k)||SLOTS[0]).hex;

/* ---------- 현장별 색 ----------
   c=막대/테두리 색, bg=달력 칸 배경, ink=글자색.
   순서는 이웃끼리 최대한 안 닮게 섞어 두었습니다(자동 배정 시 구분이 잘 되도록). */
const SITE_COLORS = [
  { c:'#3b82f6', bg:'#eff6ff', ink:'#1e3a8a' },
  { c:'#ef4444', bg:'#fef2f2', ink:'#7f1d1d' },
  { c:'#22c55e', bg:'#f0fdf4', ink:'#14532d' },
  { c:'#a855f7', bg:'#faf5ff', ink:'#581c87' },
  { c:'#f97316', bg:'#fff7ed', ink:'#7c2d12' },
  { c:'#06b6d4', bg:'#ecfeff', ink:'#164e63' },
  { c:'#ec4899', bg:'#fdf2f8', ink:'#831843' },
  { c:'#84cc16', bg:'#f7fee7', ink:'#365314' },
  { c:'#6366f1', bg:'#eef2ff', ink:'#312e81' },
  { c:'#eab308', bg:'#fefce8', ink:'#713f12' },
  { c:'#14b8a6', bg:'#f0fdfa', ink:'#134e4a' },
  { c:'#f43f5e', bg:'#fff1f2', ink:'#881337' },
  { c:'#8b5cf6', bg:'#f5f3ff', ink:'#4c1d95' },
  { c:'#0ea5e9', bg:'#f0f9ff', ink:'#0c4a6e' },
  { c:'#d946ef', bg:'#fdf4ff', ink:'#701a75' },
  { c:'#78716c', bg:'#fafaf9', ink:'#292524' }
];
const colorAt = i => SITE_COLORS[((i|0) % SITE_COLORS.length + SITE_COLORS.length) % SITE_COLORS.length];

/* 가장 적게 쓰인 색을 고름 — 현장이 16곳을 넘어가도 겹침이 골고루 퍼집니다 */
function nextColorIdx(skipId){
  const used = new Array(SITE_COLORS.length).fill(0);
  D.sites.forEach(s=>{ if(s.id!==skipId && Number.isInteger(s.color)) used[colorIdxOf(s)]++; });
  let best = 0;
  for(let i=1;i<used.length;i++) if(used[i] < used[best]) best = i;
  return best;
}
const colorIdxOf = s => ((s && Number.isInteger(s.color) ? s.color : 0) % SITE_COLORS.length + SITE_COLORS.length) % SITE_COLORS.length;
const siteColor  = s => colorAt(colorIdxOf(s));
/* 색 기준이 '현장별'인지 */
const bySite = () => D.ui.colorBy !== 'slot';
/* 목록·패널 왼쪽 세로 막대 색 */
const barHex = s => bySite() ? siteColor(s).c : slotHex(s.slot);

/* ---------- 완료 체크 ----------
   D.done['2026-08-12'] = { 's3':true, '__once':true }  — 날짜별로 끝낸 것만 기록 */
function doneBox(date){ return D.done[date] || null; }
const isDone = (date, id) => !!(D.done[date] && D.done[date][id]);
function toggleDone(date, id){
  const box = D.done[date] || (D.done[date] = {});
  if(box[id]) delete box[id]; else box[id] = true;
  if(!Object.keys(box).length) delete D.done[date];
  save(true);
  return isDone(date, id);
}
/* 그 날 할 일이 전부 끝났는지 (휴무일은 세지 않음) */
function dayAllDone(d, s){
  if(D.offdays[s]) return false;
  const ids = cellItems(d).map(x=>x.s.id);
  if(onceOn(s)) ids.push('__once');
  return ids.length > 0 && ids.every(id=>isDone(s, id));
}

/* 예전 데이터에는 color가 없으니 한 번만 채워 넣습니다 */
function migrateColors(){
  let changed = false;
  D.sites.forEach(s=>{
    if(!Number.isInteger(s.color)){ s.color = nextColorIdx(s.id); changed = true; }
  });
  if(changed) save(true);
}

/* ---------- 반복 규칙 ---------- */
/*
  rep = { type:'weekly',       days:[1,3] }
      | { type:'biweekly',     days:[3], anchor:'YYYY-MM-DD' }
      | { type:'monthly_date', day:15 }
      | { type:'monthly_nth',  nth:2, weekday:3 }
      | { type:'dates',        dates:['YYYY-MM-DD', ...] }   // 지정 날짜
*/
function occursOn(site, date){
  if(site.paused) return false;
  const s = ymd(date);
  if(site.startDate && s < site.startDate) return false;
  if(site.endDate   && s > site.endDate)   return false;
  if(site.skips && site.skips.includes(s)) return false;

  const r = site.rep || {};
  const dow = date.getDay();

  if(r.type === 'dates')    return (r.dates||[]).includes(s);
  if(r.type === 'weekly')   return (r.days||[]).includes(dow);

  if(r.type === 'biweekly'){
    if(!(r.days||[]).includes(dow)) return false;
    const a = startOfWeek(parseYmd(r.anchor || site.startDate || todayYmd()));
    const w = startOfWeek(date);
    const diff = Math.round((w - a) / 604800000);
    return ((diff % 2) + 2) % 2 === 0;
  }
  if(r.type === 'monthly_date'){
    const dim = daysInMonth(date.getFullYear(), date.getMonth());
    return date.getDate() === Math.min(r.day || 1, dim);
  }
  if(r.type === 'monthly_nth'){
    if(date.getDay() !== r.weekday) return false;
    if(r.nth === 5) return date.getDate() + 7 > daysInMonth(date.getFullYear(), date.getMonth());
    return Math.floor((date.getDate() - 1) / 7) + 1 === r.nth;
  }
  return false;
}
function repText(site){
  const r = site.rep || {};
  const ds = (r.days||[]).slice().sort().map(i=>DOW_KR[i]).join('·');
  if(r.type==='weekly')       return `매주 ${ds}`;
  if(r.type==='biweekly')     return `격주 ${ds}`;
  if(r.type==='monthly_date') return `매월 ${r.day}일`;
  if(r.type==='monthly_nth')  return `매월 ${r.nth===5?'마지막':r.nth+'번째'} ${DOW_KR[r.weekday]}요일`;
  if(r.type==='dates')        return `지정 ${(r.dates||[]).length}일`;
  return '반복 없음';
}
function billText(s){ return s.billing==='per' ? '회당 정산' : '월 정액'; }

const CLOCK_ORDER = { dawn:0, morning:1, afternoon:2, evening:3 };

function sitesOn(date){
  return D.sites.filter(s=>occursOn(s,date))
    .sort((a,b)=> (CLOCK_ORDER[a.slot]-CLOCK_ORDER[b.slot]) || a.name.localeCompare(b.name,'ko'));
}
function cellItems(d){
  return D.sites.filter(s=>occursOn(s,d)).map(s=>({s,w:d}))
    .sort((a,b)=> (CLOCK_ORDER[a.s.slot]-CLOCK_ORDER[b.s.slot]) || a.s.name.localeCompare(b.s.name,'ko'));
}
function onceOn(dateStr){
  const o = D.once[dateStr];
  if(!o) return null;
  if(!(o.place||'').trim() && !(o.note||'').trim() && !o.amount) return null;
  return o;
}
const onceLabel = o => (o.place||'').trim() || (o.note||'').split('\n')[0].trim() || '일회성';

/* ---------- 상태 ---------- */
let TAB = D.ui.tab || 0;
let anchor = startOfWeek(new Date());
let SEL = todayYmd();
let panelOpen = false;
let searchQ = '';
let SMY = new Date().getFullYear(), SMM = new Date().getMonth();   // 정산 보는 달

/* ---------- DOM ---------- */
const $ = s => document.querySelector(s);
const calwrap = $('#calwrap'), daypanel = $('#daypanel'),
      banner = $('#banner'), bannerInner = $('#bannerInner'), backdrop = $('#backdrop');

let toastTimer;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove('on'), 1600);
}
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ---------- 배너 ---------- */
function openBanner(html){
  bannerInner.innerHTML = html;
  banner.classList.add('open'); backdrop.classList.add('on');
}
function closeBanner(){ banner.classList.remove('open'); backdrop.classList.remove('on'); }
backdrop.addEventListener('click', closeBanner);

/* ---------- 현장 방문 기록 ----------
   반복 규칙을 과거로 되짚어서 실제로 잡혔던 날을 모읍니다. */
function pastVisits(site, fromDate, n){
  const out = [];
  let d = parseYmd(fromDate);
  for(let i=0; i<420 && out.length<n; i++){          /* 최대 약 14개월까지만 훑습니다 */
    d = addDays(d, -1);
    const s = ymd(d);
    if(occursOn(site, d)) out.push(s);
  }
  return out;
}
function historyHtml(site, dateStr){
  const days = pastVisits(site, dateStr, 6);
  if(!days.length) return '';
  const rows = days.map(s=>{
    const m = (D.memos[s]||'').trim();
    const dn = isDone(s, site.id);
    return `<div class="histrow">
        <div class="hd">${esc(labelDate(s))}${dn?'<small class="histdone">✔ 완료</small>':''}</div>
        <div class="hm ${m?'':'none'}">${m ? esc(m.length>110 ? m.slice(0,110)+'…' : m) : '메모 없음'}</div>
      </div>`;
  }).join('');
  return `<div class="hist"><div class="t">지난 방문 ${days.length}회 · 그날 메모</div>${rows}</div>`;
}

function copyAddr(id){
  const s = D.sites.find(x=>x.id===id); if(!s) return;
  copyText(s.address||'', '주소를 복사했습니다');
}
function copyText(t, msg){
  if(!t){ toast('복사할 내용이 없습니다'); return; }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(()=>toast(msg), ()=>fallbackCopy(t, msg));
  } else fallbackCopy(t, msg);
}
function fallbackCopy(t, msg){
  const ta = document.createElement('textarea');
  ta.value = t; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast(msg); }catch(e){ toast('복사하지 못했습니다'); }
  ta.remove();
}
function openMap(id, kind){
  const s = D.sites.find(x=>x.id===id); if(!s) return;
  const addr = (s.address||'').trim();
  if(!addr){ toast('주소가 비어 있습니다'); return; }
  const q = encodeURIComponent(addr);

  if(kind === 'tmap'){
    // T맵은 앱 전용이라 앱 주소로 먼저 열어보고, 안 열리면 티맵 웹으로 넘어감
    let gone = false;
    const onHide = ()=>{ gone = true; };
    document.addEventListener('visibilitychange', onHide, { once:true });
    window.location.href = `tmap://search?name=${q}`;
    setTimeout(()=>{
      document.removeEventListener('visibilitychange', onHide);
      if(!gone && !document.hidden){
        window.open(`https://tmap.co.kr/tmap2/mobile/route.jsp?name=${q}`, '_blank');
      }
    }, 1200);
    return;
  }
  const url = kind==='kakao'
    ? `https://map.kakao.com/link/search/${q}`
    : `https://map.naver.com/p/search/${q}`;
  window.open(url, '_blank');
}

function skipDate(id, dateStr){
  const s = D.sites.find(x=>x.id===id); if(!s) return;
  s.skips = s.skips || [];
  if(!s.skips.includes(dateStr)) s.skips.push(dateStr);
  save(true); closeBanner(); render(); toast('이 날짜만 제외했습니다');
}

function cellBody(d, s){
  if(TAB===2){
    const m = (D.memos[s]||'').trim();
    return m ? `<div class="memodot"></div><div class="memoprev">${esc(m.split('\n')[0].trim().slice(0,5))}</div>` : '';
  }
  if(TAB===1){
    const o = onceOn(s); if(!o) return '';
    return `<div class="ev once">${esc(onceLabel(o))}</div>` +
           (o.amount ? `<div class="evmore">${won(o.amount)}</div>` : '');
  }
  const list = cellItems(d);
  const dawn = list.filter(x=>x.s.slot==='dawn');
  const rest = list.filter(x=>x.s.slot!=='dawn');
  const o = onceOn(s);

  const evHtml = ({s:st, w}) => {
    const k = bySite() ? siteColor(st) : null;
    const sty = k ? ` style="--c:${k.c};--cbg:${k.bg};--cink:${k.ink}"` : '';
    const dn = isDone(ymd(w), st.id) ? ' done' : '';
    return `<div class="ev s-${st.slot}${k?' sc':''}${dn}"${sty} data-act="site" data-id="${st.id}" data-date="${ymd(w)}">${esc(st.short||st.name)}</div>`;
  };

  const chips = [];
  dawn.forEach(x=>chips.push(evHtml(x)));
  if(o) chips.push(`<div class="ev once${isDone(s,'__once')?' done':''}">${esc(onceLabel(o))}</div>`);
  rest.forEach(x=>chips.push(evHtml(x)));

  const room = maxInCell();
  let out = '';
  chips.slice(0, room).forEach((html, i)=>{
    if(dawn.length && i === dawn.length) out += '<div class="dawnsep"></div>';
    out += html;
  });
  if(chips.length > room) out += `<div class="evmore">+${chips.length - room}</div>`;
  return out;
}

/* 검색어 부분을 노란색으로 */
function hl(text, q){
  const t = esc(text), needle = esc(q);
  if(!needle) return t;
  const i = t.toLowerCase().indexOf(needle.toLowerCase());
  if(i < 0) return t;
  return t.slice(0,i) + '<mark>' + t.slice(i, i+needle.length) + '</mark>' + t.slice(i+needle.length);
}
/* 메모가 길면 검색어 주변만 잘라서 보여줍니다 */
function excerpt(v, q){
  const i = v.toLowerCase().indexOf(q.toLowerCase());
  if(i < 0) return v.length>140 ? v.slice(0,140)+'…' : v;
  const from = Math.max(0, i-50), to = Math.min(v.length, i+q.length+90);
  return (from?'…':'') + v.slice(from,to) + (to<v.length?'…':'');
}

function renderSearch(){
  const q = searchQ.trim(), ql = q.toLowerCase();
  panelOpen = false; daypanel.classList.remove('open'); daypanel.innerHTML='';
  calwrap.classList.add('list');

  /* 현장 — 이름·짧은이름·주소·담당자·출입·주차·작업내용·특이사항 전부 */
  const FIELDS = [['name','현장명'],['short','표시이름'],['address','주소'],['manager','담당자'],
                  ['entry','출입'],['parking','주차'],['work','작업내용'],['note','특이사항']];
  const siteHits = D.sites.map(s=>{
    const where = FIELDS.filter(([k])=>String(s[k]||'').toLowerCase().includes(ql));
    return where.length ? { s, where } : null;
  }).filter(Boolean)
    .sort((a,b)=> a.s.name.localeCompare(b.s.name,'ko'));

  const memoHits = Object.entries(D.memos)
    .filter(([k,v]) => (v||'').toLowerCase().includes(ql))
    .sort((a,b)=> b[0].localeCompare(a[0]));

  let out = '';
  if(siteHits.length){
    out += `<div class="ressec">현장 ${siteHits.length}곳</div>`;
    out += siteHits.map(({s,where})=>{
      const first = where[0];
      const val = String(s[first[0]]||'');
      const sub = first[0]==='name' || first[0]==='short'
        ? `${slotName(s.slot)} · ${repText(s)}`
        : `${first[1]} · ${hl(val.length>60?val.slice(0,60)+'…':val, q)}`;
      return `<div class="result site" data-act="gosite" data-id="${s.id}">
          <div class="bar" style="background:${barHex(s)}"></div>
          <div style="flex:1;min-width:0">
            <div class="n">${hl(s.name, q)}${s.paused?' <span class="chip">중지</span>':''}</div>
            <div class="w">${sub}</div>
          </div>
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"><path d="M9 18l6-6-6-6"/></svg>
        </div>`;
    }).join('');
  }
  if(memoHits.length){
    out += `<div class="ressec">메모 ${memoHits.length}건</div>`;
    out += memoHits.map(([k,v])=>`
      <div class="result" data-act="gomemo" data-date="${k}">
        <div class="d">${esc(labelDate(k))}</div>
        <div class="x">${hl(excerpt(v, q), q)}</div>
      </div>`).join('');
  }

  calwrap.innerHTML =
    `<div class="searchbar"><input id="qInput" type="text" placeholder="현장·주소·담당자·메모 검색" value="${esc(searchQ)}"></div>` +
    (out || `<div class="empty">"${esc(q)}" 검색 결과가 없습니다</div>`);
  const inp = $('#qInput');
  inp.addEventListener('input', e=>{ searchQ = e.target.value; searchQ.trim() ? renderSearch() : render(); });
  inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length);
}

/* =========================================================
   정산금액
   - 정기청소: 현장 "이름"당 한 줄.
       · 월 정액 → 그 달에 일정이 있으면 금액 1번만
       · 회당    → 회당 금액 × 그 달 일정 횟수
   - 일회성: 건별로 전부 더하되 정기 합계와 섞지 않음
   ========================================================= */
function settleKey(){ return `${SMY}-${pad(SMM+1)}`; }
/* ---------- 밀린 미수금 ----------
   앱을 쓰기 시작한 달(D.ui.since)보다 이전은 세지 않습니다 — 안 쓰던 때가 미수로 잡히면 안 되니까요. */
function ensureSince(){
  if(!D.ui.since){
    const n = new Date();
    D.ui.since = `${n.getFullYear()}-${pad(n.getMonth()+1)}`;
    save(true);
  }
  return D.ui.since;
}
function overdueOf(name){
  const since = ensureSince();
  const res = { months:0, amount:0, labels:[] };
  for(let i=1; i<=12; i++){
    const d = new Date(SMY, SMM - i, 1);
    const key = `${d.getFullYear()}-${pad(d.getMonth()+1)}`;
    if(key < since) break;
    const st = D.settle[key];
    if(st && st.paid && st.paid[name]) continue;
    const row = regularRows(d.getFullYear(), d.getMonth()).find(r=>r.name===name);
    if(!row || !row.total) continue;
    res.months++; res.amount += row.total; res.labels.push(`${d.getMonth()+1}월`);
  }
  res.labels.reverse();
  return res;
}

function settleStore(){
  const k = settleKey();
  D.settle[k] = D.settle[k] || {};
  const s = D.settle[k];
  s.inv = s.inv || {}; s.paid = s.paid || {};
  s.oinv = s.oinv || {}; s.opaid = s.opaid || {};
  return s;
}
function regularRows(Y, M){
  const y = (Y===undefined) ? SMY : Y, m = (M===undefined) ? SMM : M;
  const dim = daysInMonth(y, m);
  const map = new Map();          // 현장 이름 기준으로 묶음
  D.sites.forEach(s=>{
    let cnt = 0;
    for(let i=1; i<=dim; i++) if(occursOn(s, new Date(y, m, i))) cnt++;
    if(!cnt) return;
    const k = (s.name||'').trim() || '(이름 없음)';
    const g = map.get(k) || { name:k, cnt:0, amount:0, billing:'monthly', invoice:false, slots:new Set() };
    g.cnt += cnt;
    g.amount = Math.max(g.amount, parseAmt(s.amount));
    if(s.billing === 'per') g.billing = 'per';
    if(s.invoice) g.invoice = true;
    g.slots.add(s.slot);
    map.set(k, g);
  });
  return [...map.values()].map(g=>({
    ...g,
    total: g.billing === 'per' ? g.amount * g.cnt : g.amount
  })).sort((a,b)=> b.total - a.total || a.name.localeCompare(b.name,'ko'));
}
function onceRows(){
  const p = settleKey();
  return Object.keys(D.once).filter(k=>k.startsWith(p))
    .map(k=>({ date:k, o:D.once[k] }))
    .filter(x=>x.o && (x.o.amount || (x.o.place||'').trim()))
    .sort((a,b)=> a.date.localeCompare(b.date));
}

/* ---------- 하루 일정 공유 ---------- */
function dayText(date){
  const d = parseYmd(date);
  const L = [];
  L.push(`${labelDate(date)}${holidayOf(date)?' · '+holidayOf(date):''}${D.offdays[date]?' · 휴무':''}`);
  L.push('');
  const list0 = cellItems(d);
  const list = [...list0.filter(x=>x.s.slot==='dawn'), ...list0.filter(x=>x.s.slot!=='dawn')];
  if(list.length){
    list.forEach(({s})=>{
      const mark = isDone(date, s.id) ? ' ✔완료' : '';
      L.push(`■ ${s.name} — ${s.slot==='dawn' ? '새벽(전날 밤 출발)' : slotName(s.slot)}${mark}`);
      if((s.address||'').trim())  L.push(`   ${s.address.trim()}`);
      if((s.manager||'').trim())  L.push(`   담당 ${s.manager.trim()}`);
      if((s.entry||'').trim())    L.push(`   출입 ${s.entry.trim()}`);
      if((s.parking||'').trim())  L.push(`   주차 ${s.parking.trim()}`);
      if((s.work||'').trim())     L.push(`   작업 ${s.work.trim().split('\n').join(' / ')}`);
      if((s.note||'').trim())     L.push(`   특이 ${s.note.trim().split('\n').join(' / ')}`);
    });
  }
  const o = onceOn(date);
  if(o){
    L.push(`■ ${onceLabel(o)} — 일회성${o.amount?' · '+won(o.amount)+'원':''}${isDone(date,'__once')?' ✔완료':''}`);
    if((o.note||'').trim()) L.push(`   ${o.note.trim().split('\n').join(' / ')}`);
  }
  if(!list.length && !o) L.push('잡힌 일정이 없습니다');
  const m = (D.memos[date]||'').trim();
  if(m){ L.push(''); L.push('[메모]'); L.push(m); }
  return L.join('\n');
}
function shareDay(date){
  const t = dayText(date);
  if(navigator.share){
    navigator.share({ title:`${labelDate(date)} 일정`, text:t })
      .then(()=>{}, ()=>copyText(t, '일정을 복사했습니다'));
  } else copyText(t, '일정을 복사했습니다');
}

function copySettle(){
  const st = settleStore();
  const reg = regularRows(), onc = onceRows();
  const regTotal = reg.reduce((a,b)=>a+b.total,0);
  const oncTotal = onc.reduce((a,b)=>a+parseAmt(b.o.amount),0);
  const regPaid  = reg.filter(r=>st.paid[r.name]).reduce((a,b)=>a+b.total,0);
  const oncPaid  = onc.filter(r=>st.opaid[r.date]).reduce((a,b)=>a+parseAmt(b.o.amount),0);
  const grand = regTotal + oncTotal, paid = regPaid + oncPaid;
  const mark = (inv,pd)=>{ const m=[]; if(inv) m.push('계산서'); if(pd) m.push('입금완료'); return m.length?` [${m.join('·')}]`:''; };

  const L = [];
  L.push(`${SMY}년 ${SMM+1}월 정산`);
  L.push('');
  L.push('■ 정기청소');
  if(reg.length) reg.forEach(r=>{
    const detail = r.billing==='per' ? ` (회당 ${won(r.amount)} × ${r.cnt}회)` : '';
    L.push(`- ${r.name}${detail} : ${won(r.total)}원${mark(st.inv[r.name], st.paid[r.name])}`);
  });
  else L.push('- 내역 없음');
  L.push(`정기 합계 : ${won(regTotal)}원`);
  L.push('');
  L.push('■ 일회성');
  if(onc.length) onc.forEach(r=>{
    const d = parseYmd(r.date);
    L.push(`- ${d.getMonth()+1}/${d.getDate()} ${onceLabel(r.o)} : ${won(r.o.amount)}원${mark(st.oinv[r.date], st.opaid[r.date])}`);
  });
  else L.push('- 내역 없음');
  L.push(`일회성 합계 : ${won(oncTotal)}원`);
  L.push('');
  L.push(`전체 합계 : ${won(grand)}원`);
  L.push(`입금 완료 : ${won(paid)}원`);
  L.push(`미수금 : ${won(grand-paid)}원`);

  copyText(L.join('\n'), '정산 내용을 복사했습니다');
}

let lastTap = {}, siteTapTimer = null, siteTapKey = null;
function onAct(e){
  const el = e.target.closest('[data-act]'); if(!el) return;
  const act = el.dataset.act, date = el.dataset.date;

  if(act==='ck'){
    const st = settleStore();
    const box = el.dataset.scope==='site'
      ? (el.dataset.kind==='inv' ? st.inv : st.paid)
      : (el.dataset.kind==='inv' ? st.oinv : st.opaid);
    const k = el.dataset.k;
    if(box[k]) delete box[k]; else box[k] = true;
    save(true); renderSettle();
    return;
  }
  if(act==='offday'){
    if(D.offdays[SEL]) delete D.offdays[SEL]; else D.offdays[SEL] = true;
    save(true); renderCal(); renderPanel();
    toast(D.offdays[SEL] ? '휴무로 표시했습니다' : '휴무를 해제했습니다');
    return;
  }
  if(act==='site'){
    e.stopPropagation();
    const id = el.dataset.id, key = id + '@' + date;
    if(siteTapTimer && siteTapKey === key){        // 두 번 빠르게 누르면 바로 수정 화면
      clearTimeout(siteTapTimer); siteTapTimer = null; siteTapKey = null;
      closeBanner(); editSite(id); return;
    }
    clearTimeout(siteTapTimer);                    // 한 번만 누르면 잠깐 뒤 배너가 열림
    siteTapKey = key;
    siteTapTimer = setTimeout(()=>{
      siteTapTimer = null; siteTapKey = null; bannerSite(id, date);
    }, 250);
    return;
  }
  if(act==='done'){
    e.stopPropagation();
    const on = toggleDone(date, el.dataset.id);
    if(navigator.vibrate) navigator.vibrate(on ? 18 : 8);
    renderCal(); renderPanel();
    return;
  }
  if(act==='newsite'){ editSite(null, SEL); return; }
  if(act==='closepanel'){ panelOpen = false; renderCal(); renderPanel(); return; }
  if(act==='once'){ TAB = 1; D.ui.tab = 1; save(); render(); return; }
  if(act==='gosite'){ editSite(el.dataset.id); return; }
  if(act==='gomemo'){ SEL = date; searchQ = ''; panelOpen = true; anchor = startOfWeek(parseYmd(date)); render(); return; }
  if(act==='day'){
    const now = Date.now();
    if(lastTap.date===date && now-lastTap.t < 400){
      lastTap = {}; SEL = date; closeBanner(); editSite(null, date);
      toast(DOW_KR[parseYmd(date).getDay()]+'요일로 새 현장 등록');
      return;
    }
    lastTap = { date, t: now };
    panelOpen = !(panelOpen && SEL===date);
    SEL = date; closeBanner(); renderCal(); renderPanel();
  }
}

    <div class="field"><label>출입</label><input type="text" id="fEntry" placeholder="비밀번호, 열쇠 위치 등"></div>
    <div class="field"><label>주차</label><input type="text" id="fParking"></div>
    <div class="field"><label>작업내용</label><textarea id="fWork"></textarea></div>
    <div class="field"><label>특이사항</label><textarea id="fNote"></textarea></div>

    <div class="swrow"><div><b>계산서 발행</b><div class="hint">발행하는 곳인지 표시만 합니다</div></div><div class="sw" id="fInvoice"></div></div>
    <div class="swrow"><div><b>일시 중지</b><div class="hint">달력에 표시하지 않습니다</div></div><div class="sw" id="fPaused"></div></div>
    ${form.skips.length?`<div class="hint" style="margin-top:10px">건너뛴 날짜 ${form.skips.length}개 <button style="color:#0ea5e9;font-weight:800" onclick="clearSkips()">모두 되돌리기</button></div>`:''}

    <div class="bn-actions" style="margin-top:18px">
      ${s?`<button class="btn dan" onclick="delSite('${s.id}')">삭제</button>`:''}
      <button class="btn pri" onclick="saveSite()">저장</button>
    </div>
  `, bindForm);
}

function bindForm(){
  const set = (sel,v)=>{ const e=$(sel); if(e) e.value = v||''; };
  set('#fName',form.name); set('#fShort',form.short); set('#fAddress',form.address); set('#fManager',form.manager);
  set('#fEntry',form.entry); set('#fParking',form.parking); set('#fWork',form.work);
  set('#fNote',form.note); set('#fStart',form.startDate);
  set('#fAnchor',form.rep.anchor); set('#fMday',form.rep.day);
  $('#fAmount').value = form.amount ? won(form.amount) : '';

  ['fName','fShort','fAddress','fManager','fEntry','fParking','fWork','fNote'].forEach(idn=>{
    const k = idn.slice(1).charAt(0).toLowerCase()+idn.slice(2);
    $('#'+idn).addEventListener('input', e=>{ form[k] = e.target.value; });
  });
  $('#fAmount').addEventListener('input', e=>{
    form.amount = parseAmt(e.target.value);
    e.target.value = form.amount ? won(form.amount) : '';
    billHint();
  });
  $('#fStart').addEventListener('change', e=>{ form.startDate = e.target.value; });
  $('#fAnchor').addEventListener('change', e=>{ form.rep.anchor = e.target.value; });
  $('#fMday').addEventListener('input', e=>{ form.rep.day = Math.max(1, Math.min(31, +e.target.value||1)); });

  const segPick = (wrap, cur, cb) => {
    const w = $(wrap); if(!w) return;
    w.querySelectorAll('button').forEach(b=>{
      b.classList.toggle('on', String(b.dataset.v)===String(cur));
      b.onclick = ()=>{ w.querySelectorAll('button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); cb(b.dataset.v); };
    });
  };
  const dawnUI = v=>{
    $('#dawnHint').style.display = v==='dawn'?'block':'none';
    $('#dowLabel').textContent = v==='dawn' ? '요일 (청소하는 새벽 요일)' : '요일';
  };
  segPick('#fSlot', form.slot, v=>{ form.slot = v; dawnUI(v); });
  dawnUI(form.slot);
  segPick('#fRep', form.rep.type, v=>{ form.rep.type = v; repVis(); });
  segPick('#fNth', form.rep.nth, v=>{ form.rep.nth = +v; });
  segPick('#fNthDow', form.rep.weekday, v=>{ form.rep.weekday = +v; });
  segPick('#fBilling', form.billing, v=>{ form.billing = v; billHint(); });

  const dw = $('#fDows');
  dw.querySelectorAll('button').forEach(b=>{
    const i = +b.dataset.v;
    b.classList.toggle('on', form.rep.days.includes(i));
    b.onclick = ()=>{
      const k = form.rep.days.indexOf(i);
      if(k>=0) form.rep.days.splice(k,1); else form.rep.days.push(i);
      b.classList.toggle('on');
    };
  });

  const sw = (sel,key)=>{ const e=$(sel); e.classList.toggle('on', !!form[key]); e.onclick=()=>{ form[key]=!form[key]; e.classList.toggle('on', form[key]); }; };
  sw('#fInvoice','invoice'); sw('#fPaused','paused');

  if(!Number.isInteger(form.color)) form.color = nextColorIdx(form.id);
  const cw = $('#fColor');
  if(cw){
    const paint = () => cw.querySelectorAll('button').forEach(b2=>b2.classList.toggle('on', +b2.dataset.v === colorIdxOf(form)));
    cw.querySelectorAll('button').forEach(b2=>{
      b2.addEventListener('click', ()=>{ form.color = +b2.dataset.v; paint(); });
    });
    paint();
  }

  drawDates(); repVis(); billHint();
}
function billHint(){
  const e = $('#billHint'); if(!e) return;
  e.innerHTML = form.billing==='per'
    ? `그 달에 실제로 잡힌 횟수만큼 곱해집니다. 예) ${won(form.amount||50000)}원 × 3회 = <b>${won((form.amount||50000)*3)}원</b>`
    : `그 달에 일정이 있으면 <b>${won(form.amount||0)}원</b>이 한 번만 더해집니다. 주5일이어도 똑같습니다.`;
}
function repVis(){
  const t = form.rep.type;
  $('#wrapDows').style.display   = (t==='weekly'||t==='biweekly') ? 'block':'none';
  $('#wrapAnchor').style.display = (t==='biweekly') ? 'block':'none';
  $('#wrapMday').style.display   = (t==='monthly_date') ? 'block':'none';
  $('#wrapNth').style.display    = (t==='monthly_nth') ? 'block':'none';
  $('#wrapDates').style.display  = (t==='dates') ? 'block':'none';
}
function drawDates(){
  const box = $('#datesList'); if(!box) return;
  const ds = form.rep.dates.slice().sort();
  box.innerHTML = ds.length
    ? ds.map(d=>`<span class="datechip">${esc(labelDate(d))} <b onclick="delRepDate('${d}')">✕</b></span>`).join('')
    : `<div class="hint" style="margin:0">아직 고른 날짜가 없습니다</div>`;
}
function addRepDate(){
  const v = $('#fDateAdd').value;
  if(!v){ toast('날짜를 골라 주세요'); return; }
  if(!form.rep.dates.includes(v)) form.rep.dates.push(v);
  $('#fDateAdd').value = '';
  drawDates();
}
function delRepDate(d){
  form.rep.dates = form.rep.dates.filter(x=>x!==d);
  drawDates();
}
function clearSkips(){ form.skips = []; toast('저장하면 반영됩니다'); }

function saveSite(){
  if(!form.name.trim()){ toast('현장명을 입력해 주세요'); return; }
  const t = form.rep.type;
  if((t==='weekly'||t==='biweekly') && !form.rep.days.length){ toast('요일을 선택해 주세요'); return; }
  if(t==='dates' && !form.rep.dates.length){ toast('지정 날짜를 하나 이상 골라 주세요'); return; }
  if(t==='biweekly' && !form.rep.anchor) form.rep.anchor = todayYmd();
  form.rep.days.sort();
  form.rep.dates.sort();
  delete form.price;
  const i = D.sites.findIndex(x=>x.id===form.id);
  if(i>=0) D.sites[i] = form; else D.sites.push(form);
  save(true); closeSheet(); closeBanner();
  panelOpen = false;                 /* 아래 상세 패널까지 닫고 달력으로 */
  render(); toast('저장했습니다');
}
function delSite(id){
  if(!confirm('이 현장을 삭제할까요? 달력에서 모두 사라집니다.')) return;
  D.sites = D.sites.filter(x=>x.id!==id);
  save(true); closeSheet(); closeBanner();
  panelOpen = false;
  render(); toast('삭제했습니다');
}

function openVacation(){
  const offCnt = Object.keys(D.offdays).length;
  openSheet('휴가 기간 지정', `
    <div class="field"><label>시작일</label><input type="date" id="vFrom"></div>
    <div class="field"><label>종료일</label><input type="date" id="vTo"></div>
    <div class="bn-actions">
      <button class="btn sec" onclick="applyVac(false)">휴무 해제</button>
      <button class="btn pri" onclick="applyVac(true)">휴무로 지정</button>
    </div>
    <div class="hint" style="margin-top:12px">현재 휴무로 표시된 날 ${offCnt}일.
      하루만 바꿀 때는 달력에서 날짜를 누른 뒤 아래 <b>휴무</b> 스위치를 쓰세요.</div>
  `);
}
function applyVac(on){
  const a = $('#vFrom').value, b = $('#vTo').value;
  if(!a || !b){ toast('시작일과 종료일을 골라 주세요'); return; }
  if(a > b){ toast('종료일이 시작일보다 빠릅니다'); return; }
  let d = parseYmd(a); const end = parseYmd(b); let n = 0;
  while(ymd(d) <= ymd(end)){
    if(on) D.offdays[ymd(d)] = true; else delete D.offdays[ymd(d)];
    d = addDays(d,1); n++;
    if(n > 400) break;
  }
  save(true); closeSheet(); render();
  toast(on ? `${n}일을 휴무로 표시했습니다` : `${n}일의 휴무를 해제했습니다`);
}

/* ---------- 백업 알림 ---------- */
function markBackup(){ D.ui.lastBackup = todayYmd(); save(true); refreshBackupBadge(); }
function daysSinceBackup(){
  const b = D.ui.lastBackup;
  if(!b) return null;                                   /* 한 번도 안 했음 */
  return Math.max(0, Math.round((parseYmd(todayYmd()) - parseYmd(b)) / 86400000));
}
/* 데이터가 있는데 30일 넘게 백업을 안 했으면 경고 */
function backupOverdue(){
  if(!D.sites.length && !Object.keys(D.once).length && !Object.keys(D.memos).length) return false;
  const n = daysSinceBackup();
  return n === null || n >= 30;
}
function refreshBackupBadge(){
  const b = $('#btnMenu'); if(b) b.classList.toggle('warn', backupOverdue());
}

const backupName = () => `cleandiary-backup-${todayYmd()}.json`;
const backupJson = () => JSON.stringify(D, null, 2);

function exportData(){
  const json = backupJson();
  openSheet('백업 내보내기', `
    <div class="hint" style="margin:0 0 12px">휴대폰에서는 방법에 따라 저장이 막히기도 합니다.
      <b>공유하기</b>가 가장 잘 되고, 안 되면 <b>글로 복사</b>해서 메모장이나 카톡 내게쓰기에 붙여넣어 두세요. 그 글만 있으면 그대로 되살릴 수 있습니다.</div>
    <button class="btn pri" style="margin-bottom:10px" onclick="shareBackup()">공유하기 (카톡·메모·파일 앱)</button>
    <button class="btn sec" style="margin-bottom:10px" onclick="downloadBackup()">파일로 다운로드</button>
    <button class="btn sec" style="margin-bottom:10px" onclick="copyBackup()">백업 내용 글로 복사</button>
    <div class="field" style="margin-top:6px"><label>백업 내용 (길게 눌러 전체 선택해도 됩니다)</label>
      <textarea id="bkTa" style="min-height:150px;font-size:11px" readonly></textarea></div>
    <div class="hint">현장 ${D.sites.length}곳 · 일회성 ${Object.keys(D.once).length}건 · 메모 ${Object.keys(D.memos).length}건</div>
  `, ()=>{ $('#bkTa').value = json; });
}
function shareBackup(){
  const json = backupJson(), name = backupName();
  try{
    const file = new File([json], name, { type:'application/json' });
    if(navigator.canShare && navigator.canShare({ files:[file] })){
      navigator.share({ files:[file], title:name })
        .then(()=>{ markBackup(); toast('내보냈습니다'); })
        .catch(()=>{});
      return;
    }
    if(navigator.share){
      navigator.share({ title:name, text:json }).then(()=>markBackup(), ()=>{});
      return;
    }
  }catch(e){}
  toast('이 브라우저는 공유를 지원하지 않습니다');
}
function downloadBackup(){
  const json = backupJson(), name = backupName();
  try{
    const blob = new Blob([json], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name; a.rel = 'noopener';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
    markBackup();
    toast('저장 목록을 확인해 보세요');
  }catch(e){ toast('다운로드가 막혀 있습니다. 글로 복사를 써주세요'); }
}
function copyBackup(){ copyText(backupJson(), '백업 내용을 복사했습니다'); markBackup(); }

/* ---------- 내비게이션 ---------- */
function clampSel(){
  const a = ymd(anchor), b = ymd(addDays(anchor,20));
  if(SEL < a || SEL > b) SEL = a;
}
function moveMonths(n){
  const d = new Date(SMY, SMM + n, 1);
  SMY = d.getFullYear(); SMM = d.getMonth();
  render();
}
function moveWeeks(n){
  if(TAB===3){ moveMonths(n); return; }
  anchor = addDays(anchor, n*7); clampSel(); panelOpen = false; closeBanner(); render();
}
$('#btnPrev').onclick  = ()=>moveWeeks(-1);
$('#btnNext').onclick  = ()=>moveWeeks(1);
$('#btnToday').onclick = ()=>{
  if(TAB===3){ const n=new Date(); SMY=n.getFullYear(); SMM=n.getMonth(); render(); return; }
  anchor = startOfWeek(new Date()); SEL = todayYmd(); searchQ=''; panelOpen=false; closeBanner(); render();
};
$('#btnMenu').onclick  = openMenu;
document.querySelectorAll('.tab').forEach(b=>{
  b.onclick = ()=>{ TAB = +b.dataset.tab; D.ui.tab = TAB; save(); searchQ=''; panelOpen=false; closeBanner(); render(); };
});

/* ---------- 길게 눌러 완료 토글 ---------- */
let lpTimer = null, lpFired = false;
function lpTarget(t){
  const ev = t.closest && t.closest('.ev'); if(!ev) return null;
  const cell = ev.closest('.cell'); if(!cell) return null;
  const date = ev.dataset.date || cell.dataset.date;
  const id = ev.dataset.id || (ev.classList.contains('once') ? '__once' : null);
  return (date && id) ? { date, id, ev } : null;
}
function lpStart(e){
  lpFired = false;                 /* 새로 누를 때마다 초기화 — 안 하면 다음 탭이 씹힙니다 */
  if(TAB !== 0) return;
  const t = lpTarget(e.target); if(!t) return;
  clearTimeout(lpTimer);
  lpTimer = setTimeout(()=>{
    lpFired = true;
    const on = toggleDone(t.date, t.id);
    if(navigator.vibrate) navigator.vibrate(on ? 18 : 8);
    clearTimeout(siteTapTimer); siteTapTimer = null; siteTapKey = null;   /* 배너가 뒤늦게 안 뜨게 */
    renderCal(); renderPanel();
    const nm = t.id==='__once' ? '일회성' : ((D.sites.find(x=>x.id===t.id)||{}).name || '');
    toast(on ? `${nm} 완료` : `${nm} 완료 취소`);
  }, 500);
}
function lpCancel(){ clearTimeout(lpTimer); lpTimer = null; }
calwrap.addEventListener('touchstart', lpStart, {passive:true});
calwrap.addEventListener('touchmove',  lpCancel, {passive:true});
calwrap.addEventListener('touchend',   lpCancel, {passive:true});
calwrap.addEventListener('mousedown',  lpStart);
calwrap.addEventListener('mouseup',    lpCancel);
calwrap.addEventListener('mouseleave', lpCancel);
/* 길게 눌러서 처리했으면 그 다음 클릭은 삼킵니다 */
calwrap.addEventListener('click', e=>{ if(lpFired){ e.stopPropagation(); e.preventDefault(); lpFired = false; } }, true);
/* 길게 누를 때 뜨는 브라우저 메뉴 막기 */
calwrap.addEventListener('contextmenu', e=>{ if(lpTarget(e.target)) e.preventDefault(); });

/* 좌우 스와이프로 이동 */
let tx=0, ty=0;
calwrap.addEventListener('touchstart', e=>{ tx=e.touches[0].clientX; ty=e.touches[0].clientY; }, {passive:true});
calwrap.addEventListener('touchend', e=>{
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if(Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)*1.8) moveWeeks(dx<0 ? 1 : -1);
}, {passive:true});

/* 홈 화면 추가용 매니페스트 (파일 없이 동작) */
(function(){
  const icon = "data:image/svg+xml;base64," + btoa(unescape(encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="112" fill="#0f172a"/><rect x="104" y="144" width="304" height="256" rx="40" fill="none" stroke="#38bdf8" stroke-width="28"/><path d="M104 224h304" stroke="#38bdf8" stroke-width="28"/><path d="M184 112v64M328 112v64" stroke="#38bdf8" stroke-width="28" stroke-linecap="round"/></svg>`)));
  const mf = { name:"cleandiary", short_name:"cleandiary", start_url:".", display:"standalone",
    background_color:"#f1f5f9", theme_color:"#0f172a",
    icons:[{src:icon, sizes:"512x512", type:"image/svg+xml", purpose:"any maskable"}] };
  const l = document.createElement('link');
  l.rel = 'manifest';
  l.href = URL.createObjectURL(new Blob([JSON.stringify(mf)], {type:'application/manifest+json'}));
  document.head.appendChild(l);
  const al = document.createElement('link');
  al.rel = 'apple-touch-icon'; al.href = icon; document.head.appendChild(al);
  if('serviceWorker' in navigator && location.protocol.startsWith('http')){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
})();

}
